<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="To-Do">
<title>TODO!</title>
<style>
/* ===== CSS (kompatibel iOS 12-15 / iPhone 6s) ===== */
:root{--bg:#ffe66d;--card:#fff;--ink:#111;--a:#ff6b6b;--b:#4ecdc4;--c:#a29bfe;--sh:#111}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#2b2438;--card:#1c1c1c;--ink:#f5f5f5;--sh:#000}}
:root[data-theme="dark"]{--bg:#2b2438;--card:#1c1c1c;--ink:#f5f5f5;--sh:#000}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--ink);
  font-family:-apple-system,"Helvetica Neue",Arial,sans-serif;font-weight:600;min-height:100vh;
  background-image:radial-gradient(var(--ink) 1px,transparent 1px);background-size:22px 22px}
.wrap{max-width:560px;margin:0 auto;
  padding:16px 14px 40px;
  padding-top:calc(16px + env(safe-area-inset-top));
  padding-bottom:calc(40px + env(safe-area-inset-bottom))}
.box{background:var(--card);border:3px solid var(--ink);box-shadow:6px 6px 0 var(--sh)}
header{display:flex;justify-content:space-between;align-items:center;padding:14px 16px;
  background:var(--a);color:#111;-webkit-transform:rotate(-1deg);transform:rotate(-1deg)}
h1{margin:0;font-size:30px;letter-spacing:-1px;text-transform:uppercase;font-weight:900}
.badge{background:#fff;color:#111;border:3px solid #111;padding:4px 10px;font-weight:800;font-size:14px;white-space:nowrap;margin-left:10px}
.add{margin:22px 0 14px}
.row{display:flex}
input[type=text]{flex:1;min-width:0;font:inherit;font-weight:800;font-size:16px;padding:12px;border:3px solid var(--ink);
  background:#fff;color:#111;box-shadow:4px 4px 0 var(--sh);outline:none;border-radius:0;-webkit-appearance:none;appearance:none}
button{font:inherit;font-weight:800;cursor:pointer;color:#111;border:3px solid var(--ink);padding:10px 14px;
  box-shadow:4px 4px 0 var(--sh);text-transform:uppercase;border-radius:0;-webkit-appearance:none;appearance:none}
button:active{-webkit-transform:translate(4px,4px);transform:translate(4px,4px);box-shadow:0 0 0 var(--sh)}
.go{background:var(--b);margin-left:10px}
.prio{margin-top:14px;font-size:13px;font-weight:800;text-transform:uppercase}
.prio span{display:block;margin-bottom:8px}
.prio button{padding:6px 10px;font-size:12px;box-shadow:2px 2px 0 var(--sh);margin:0 8px 8px 0}
.prio button.on{outline:3px solid var(--ink);outline-offset:2px}
.tabs{margin-bottom:16px}
.tabs button{background:var(--card);color:var(--ink);padding:6px 12px;font-size:13px;box-shadow:3px 3px 0 var(--sh);margin:0 8px 8px 0}
.tabs button.on{background:var(--c);color:#111}
ul{list-style:none;margin:0;padding:0}
li{display:flex;align-items:center;padding:12px;margin-bottom:14px;border-left-width:12px}
li.p1{border-left-color:var(--b)}li.p2{border-left-color:#ffd23f}li.p3{border-left-color:var(--a)}
.chk{-webkit-appearance:none;appearance:none;flex:none;width:30px;height:30px;border:3px solid var(--ink);background:#fff;
  margin:0 12px 0 0;border-radius:0;position:relative}
.chk:checked{background:var(--b)}
.chk:checked:after{content:"\2714";color:#111;font-weight:900;font-size:18px;position:absolute;left:4px;top:1px}
.t{flex:1;min-width:0;word-wrap:break-word;font-size:17px;font-weight:800}
li.done .t{text-decoration:line-through;opacity:.55}
.del{background:var(--a);padding:2px 10px;font-size:18px;box-shadow:3px 3px 0 var(--sh);margin-left:10px}
.empty{padding:28px;text-align:center;font-weight:800;background:var(--c);color:#111}
footer{margin-top:22px;display:flex;justify-content:space-between;align-items:center}
.clr{background:#ffd23f;font-size:12px}
.theme{background:var(--card);color:var(--ink);padding:6px 10px;font-size:13px;box-shadow:3px 3px 0 var(--sh)}
@media (min-width:400px){h1{font-size:38px}}
</style>
</head>
<body>
<div class="wrap">
  <header class="box"><h1>&#128221; To-Do!</h1><span class="badge" id="count">0 tersisa</span></header>

  <div class="add">
    <div class="row">
      <input type="text" id="inp" placeholder="Mau ngerjain apa?" maxlength="120" autocomplete="off">
      <button class="go" id="addBtn">Tambah</button>
    </div>
    <div class="prio"><span>Prioritas:</span>
      <button data-p="1" style="background:#4ecdc4">Santai</button><button data-p="2" style="background:#ffd23f" class="on">Biasa</button><button data-p="3" style="background:#ff6b6b">Penting</button>
    </div>
  </div>

  <div class="tabs" id="tabs">
    <button data-f="all" class="on">Semua</button><button data-f="active">Aktif</button><button data-f="done">Selesai</button>
  </div>

  <ul id="list"></ul>

  <footer>
    <button class="clr" id="clr">Hapus selesai</button>
    <button class="theme" id="theme">&#127763; Tema</button>
  </footer>
</div>

<script>
/* ===== JavaScript (ES5, tanpa fitur baru) ===== */
var todos=[],filter='all',prio=2;
try{var s=localStorage.getItem('neo-todos');if(s)todos=JSON.parse(s)||[]}catch(e){}
if(!todos.length)todos=[{id:1,text:'Contoh: minum air putih',done:false,p:1},{id:2,text:'Ketuk kotak untuk selesai',done:false,p:2}];
function save(){try{localStorage.setItem('neo-todos',JSON.stringify(todos))}catch(e){}}
function $(i){return document.getElementById(i)}
function each(sel,fn){var n=document.querySelectorAll(sel);for(var i=0;i<n.length;i++)fn(n[i])}

function render(){
  var l=$('list');l.innerHTML='';
  var v=todos.filter(function(t){return filter==='all'||(filter==='done')===t.done});
  if(!v.length)l.innerHTML='<div class="box empty">Kosong! Santai dulu...</div>';
  v.forEach(function(t){
    var li=document.createElement('li');
    li.className='box p'+t.p+(t.done?' done':'');
    var c=document.createElement('input');c.type='checkbox';c.className='chk';c.checked=t.done;
    c.onchange=function(){t.done=c.checked;save();render()};
    var sp=document.createElement('span');sp.className='t';sp.textContent=t.text;
    var d=document.createElement('button');d.className='del';d.textContent='\u2715';
    d.onclick=function(){todos=todos.filter(function(x){return x!==t});save();render()};
    li.appendChild(c);li.appendChild(sp);li.appendChild(d);l.appendChild(li);
  });
  $('count').textContent=todos.filter(function(t){return!t.done}).length+' tersisa';
}
function add(){
  var v=$('inp').value.replace(/^\s+|\s+$/g,'');if(!v)return;
  todos.unshift({id:new Date().getTime(),text:v,done:false,p:prio});
  $('inp').value='';save();render();
}
$('addBtn').onclick=add;
$('inp').onkeydown=function(e){if(e.keyCode===13)add()};
each('.prio button',function(b){b.onclick=function(){
  prio=parseInt(b.getAttribute('data-p'),10);
  each('.prio button',function(x){x.className=(x===b)?'on':''})}});
each('#tabs button',function(b){b.onclick=function(){
  filter=b.getAttribute('data-f');
  each('#tabs button',function(x){x.className=(x===b)?'on':''});render()}});
$('clr').onclick=function(){todos=todos.filter(function(t){return!t.done});save();render()};
$('theme').onclick=function(){
  var r=document.documentElement,cur=r.getAttribute('data-theme');
  var dark=cur?cur==='dark':(window.matchMedia&&window.matchMedia('(prefers-color-scheme: dark)').matches);
  r.setAttribute('data-theme',dark?'light':'dark')};
render();
</script>
</body>
</html>
